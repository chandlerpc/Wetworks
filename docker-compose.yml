services:
  architect:
    build: .
    container_name: wetworks-architect
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/New_York
    ports:
      - "8700:8700"   # ops console + Command API (reach it over Tailscale)
    volumes:
      - wetworks-data:/data
      - sandbox-runs:/data/sandbox-runs
      - forge-data:/data/forge
      - ./config:/app/config:ro
    networks:
      - default
      - sandbox
    depends_on:
      - ollama
      - searxng
      - whisper
      - sandbox
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Free local models on the MSI's GPU (also the start of The Forge)
  ollama:
    image: ollama/ollama:latest
    container_name: wetworks-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"  # keep the model loaded in GPU memory; no cold start on each run
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging: *logging

  # C.L.a.i.R's ears: speech-to-text (free, private). Runs on the CPU so the 8GB GPU stays
  # free for the local model; the MSI's CPU handles medium.en comfortably.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: wetworks-whisper
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-medium.en}   # small.en (faster) or medium.en (more accurate)
    volumes:
      - whisper-models:/root/.cache
    logging: *logging

  # Test sandbox for code missions: no secrets, no internet (internal network only),
  # read-only system, no extra privileges, capped memory and processes.
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    container_name: wetworks-sandbox
    restart: unless-stopped
    networks:
      - sandbox
    volumes:
      - sandbox-runs:/runs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
    logging: *logging

  # The Forge: fine-tuning on the GPU (Unsloth). Shares the GPU with Ollama; Wetworks unloads the
  # agents' model before a job and reloads it after. Needs internet to download base models.
  forge:
    build:
      context: .
      dockerfile: forge/Dockerfile
    container_name: wetworks-forge
    restart: unless-stopped
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - forge-data:/forge
      - forge-hf-cache:/workspace/.cache/huggingface
    environment:
      HF_HOME: /workspace/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging: *logging

  # Free self-hosted web search
  searxng:
    image: searxng/searxng:latest
    container_name: wetworks-searxng
    restart: unless-stopped
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-wetworks-local-only}
    logging: *logging

networks:
  default: {}
  sandbox:
    internal: true   # no route to the internet

volumes:
  wetworks-data:
  sandbox-runs:
  ollama-models:
  whisper-models:
  forge-data:
  forge-hf-cache:
