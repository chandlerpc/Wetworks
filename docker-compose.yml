services:
  architect:
    build: .
    container_name: wetworks-architect
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/New_York
    ports:
      - "8700:8700"   # ops console + Command API (reach it over Tailscale)
    volumes:
      - wetworks-data:/data
      - ./config:/app/config:ro
    depends_on:
      - ollama
      - searxng
      - whisper
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Free local models on the MSI's GPU (also the start of The Forge)
  ollama:
    image: ollama/ollama:latest
    container_name: wetworks-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"  # keep the model loaded in GPU memory; no cold start on each run
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging: *logging

  # C.L.a.i.R's ears: speech-to-text (free, private). Runs on the CPU so the 8GB GPU stays
  # free for the local model; the MSI's CPU handles medium.en comfortably.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: wetworks-whisper
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-medium.en}   # small.en (faster) or medium.en (more accurate)
    volumes:
      - whisper-models:/root/.cache
    logging: *logging

  # Free self-hosted web search
  searxng:
    image: searxng/searxng:latest
    container_name: wetworks-searxng
    restart: unless-stopped
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-wetworks-local-only}
    logging: *logging

volumes:
  wetworks-data:
  ollama-models:
  whisper-models:
