services:
  architect:
    build: .
    container_name: wetworks-architect
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/New_York
    ports:
      - "8700:8700"   # ops console + Command API (reach it over Tailscale)
    volumes:
      - wetworks-data:/data
      - ./config:/app/config:ro
    depends_on:
      - ollama
      - searxng
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Free local models on the MSI's GPU (also the start of The Forge)
  ollama:
    image: ollama/ollama:latest
    container_name: wetworks-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"  # keep the model loaded in GPU memory; no cold start on each run
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging: *logging

  # Free self-hosted web search
  searxng:
    image: searxng/searxng:latest
    container_name: wetworks-searxng
    restart: unless-stopped
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-wetworks-local-only}
    logging: *logging

volumes:
  wetworks-data:
  ollama-models:
