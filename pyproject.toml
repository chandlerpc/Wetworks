[project]
name = "wetworks"
version = "0.1.0"
description = "Wetworks multi-agent system — The Architect and cells"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "psutil>=5.9",
    "pydantic-settings>=2.4",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["wetworks*"]

[tool.setuptools.package-data]
wetworks = ["console/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
