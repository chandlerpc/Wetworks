# Finance cell. Your transactions stay on the MSI: only the local model ever reads them, and only
# summaries go into the brief or to cloud agents. Edit freely; it's re-read every time.

[finance]
enabled = true

# What the morning brief (and Discord) may say about money:
#   totals = category totals and amounts, never merchants or individual transactions
#   counts = no amounts at all ("2 bills due this week")
#   off    = nothing
brief = "totals"

# Let cloud agents (C.L.a.i.R on Gemini, Claude from Friday) see the same summary level as the brief.
# false = Finance is only visible in the console and to agents thinking on the local model.
share_with_cloud = false

# Monthly budgets by category (dollars). Leave a category out to just track it.
[finance.budgets]
Dining = 300
Groceries = 600
Shopping = 250
Subscriptions = 80
"AI & tools" = 60
Entertainment = 100

# Words that put a charge in a category (case-insensitive, matched inside the description).
# When you change a charge's category in the console, Wetworks remembers that merchant too.
[finance.rules]
Housing = ["rent", "mortgage", "hoa "]
Utilities = ["duke energy", "fpl", "florida power", "water util", "seminole county util", "comcast", "xfinity",
             "spectrum", "at&t", "att*", "verizon", "t-mobile", "tmobile", "teco"]
Groceries = ["publix", "aldi", "kroger", "whole foods", "trader joe", "sprouts", "winn-dixie", "costco", "sams club",
             "wal-mart super", "walmart super"]
