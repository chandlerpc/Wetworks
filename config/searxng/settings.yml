# Minimal SearXNG config for Wetworks. Only reachable inside the Docker network.
use_default_settings: true

server:
  # Overridden by the SEARXNG_SECRET env var in docker-compose.yml
  secret_key: "change-me"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json
